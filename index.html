<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fathoni Zul Majid - System Engineer</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <article class="card">

            <div class="card-head">
                <div class="card-id">
                    <img class="avatar" src="images/Fathoni.jpg" alt="Fathoni Zul Majid" />
                    <span class="status">ONLINE</span>
                </div>
                <div class="card-info">
                    <p class="label">System Engineer</p>
                    <h1 class="name">Fathoni Zul Majid</h1>
                    <p class="location">Shizuoka, Japan</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-value">3</span><span class="stat-label">Years</span>
                </div>
                <div class="stat">
                    <span class="stat-value">12</span><span class="stat-label">Projects</span>
                </div>
                <div class="stat">
                    <span class="stat-value">JP</span><span class="stat-label">Based</span>
                </div>
            </div>

            <ul class="skills">
                <li class="skill">
                    <span class="skill-name">HTML/CSS</span>
                    <span class="bar"><span class="bar-fill" style="--level: 72%"></span></span>
                </li>
                <li class="skill">
                    <span class="skill-name">JavaScript</span>
                    <span class="bar"><span class="bar-fill" style="--level: 60%"></span></span>
                </li>
                <li class="skill">
                    <span class="skill-name">React</span>
                    <span class="bar"><span class="bar-fill" style="--level: 50%"></span></span>
                </li>
            </ul>

        </article>
    </body>
</html>
